name: Deploy to game server
# Pushing to main (or a claude/* branch) deploys that exact commit to the EC2 game server.
# Auth is keyless (GitHub OIDC -> a narrow AWS role); no secrets are stored in GitHub.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
env:
  AWS_REGION: us-west-1
  INSTANCE_ID: i-00966cc1ee771d0cc
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check server.js && node --check auth.js && node --check public/game.js
      - name: Debug OIDC claims (temporary)
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "$T" | cut -d. -f2 | python3 -c 'import sys,base64,json;d=sys.stdin.read().strip();d+="="*(-len(d)%4);c=json.loads(base64.urlsafe_b64decode(d));print({k:c.get(k) for k in ("iss","aud","sub","repository","ref")})'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::405433667541:role/island-night-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy over SSM
        run: |
          SHA="${GITHUB_SHA}"
          cat > cmd.sh <<EOF
          set -euo pipefail
          W=\$(mktemp -d); cd "\$W"
          curl -fsSL "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${SHA}" -o src.tgz
          mkdir src && tar xzf src.tgz -C src --strip-components=1
          mkdir -p /var/backups/island-night && cp -a /var/lib/island-night "/var/backups/island-night/\$(date +%s)" || true
          cd src
          rm -rf /opt/game/public
          cp -r server.js auth.js package.json package-lock.json public /opt/game/
          cd /opt/game && (npm ci --omit=dev || npm install --omit=dev)
          systemctl restart game
          sleep 3
          systemctl is-active game
          curl -fsS http://localhost/ >/dev/null
          echo "deployed ${SHA}"
          EOF
          sed -i 's/^          //' cmd.sh
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters "commands=$(python3 -c 'import json;print(json.dumps(open("cmd.sh").read().split("\n")))')" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output text
          [ "$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)" = "Success" ]
