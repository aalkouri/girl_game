name: Deploy to game server
# Pushing to main (or a claude/** branch) deploys that exact commit to the DigitalOcean droplet over SSH.
# One-time server and GitHub-secret setup is described in deploy/README.md.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
env:
  DEPLOY_HOST: 138.197.207.219
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check server.js && node --check auth.js && node --check public/game.js
      - name: Check the deploy secret exists
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: '[ -n "$KEY" ] || { echo "::error::Secret DEPLOY_SSH_KEY is not set (see deploy/README.md)"; exit 1; }'
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15"
          tar czf /tmp/island-night.tgz server.js auth.js package.json package-lock.json public
          scp -i ~/.ssh/deploy_key -o BatchMode=yes /tmp/island-night.tgz "deploy@$DEPLOY_HOST:/tmp/island-night.tgz"
          $SSH "deploy@$DEPLOY_HOST" 'bash -s' -- "$GITHUB_SHA" < deploy/remote.sh
