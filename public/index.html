<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Island Night</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1a2a;color:#fff;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35) 100%)}
#hurt{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,.55) 100%);opacity:0;transition:opacity .35s}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;pointer-events:none;font-size:14px;text-shadow:0 1px 3px #000}
#hud .row{display:flex;justify-content:space-between;gap:8px}
#bar{height:10px;background:#0006;border-radius:5px;overflow:hidden;margin-top:4px;width:180px;border:1px solid #fff3}
#bar i{display:block;height:100%;background:linear-gradient(90deg,#ff7a18,#ffd000);width:0}
#banner{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:22px;font-weight:700;pointer-events:none;text-shadow:0 2px 6px #000;padding:0 16px}
.btn{position:fixed;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:3px solid #fff8;opacity:.9;touch-action:none;transition:transform .06s;box-shadow:0 4px 14px #0008}
#act{right:max(24px,env(safe-area-inset-right));bottom:max(60px,env(safe-area-inset-bottom));width:96px;height:96px;background:radial-gradient(circle at 35% 30%,#3fd196,#17835a)}
#hit{right:max(130px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom));width:76px;height:76px;background:radial-gradient(circle at 35% 30%,#ef5350,#9a1c1c)}
#btns{display:none}
#jbase,#jknob{position:fixed;display:none;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%)}
#jbase{width:110px;height:110px;border:3px solid #fff6;background:#ffffff12}
#jknob{width:44px;height:44px;background:#fff8}
#lobby{position:fixed;inset:0;background:#0b1a2af2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;overflow:auto}
#lobby h1{margin:0;font-size:32px}
#lobby input{font-size:18px;padding:12px;border-radius:10px;border:0;width:min(300px,80vw);text-align:center}
.cls{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(320px,86vw)}
.cls div{padding:10px;border-radius:10px;background:#1c3550;font-size:13px;border:2px solid transparent}
.cls div b{display:block;font-size:15px}
.cls div.sel{border-color:#ffd000;background:#274a6d}
#go{font-size:20px;padding:14px 40px;border-radius:12px;border:0;background:#1e9e6a;color:#fff;font-weight:700}
#err{color:#ff8a80;min-height:20px}
</style></head><body>
<div id="vig"></div><div id="hurt"></div>
<div id="hud" style="display:none">
  <div class="row"><div><div id="t1"></div><div id="bar"><i></i></div><div id="inv"></div></div><div style="text-align:right"><div id="rm" style="pointer-events:auto"></div><div id="pl"></div></div></div>
</div>
<div id="banner"></div>
<div id="jbase"></div><div id="jknob"></div>
<div id="btns"><div class="btn" id="act">ACT</div><div class="btn" id="hit">HIT</div></div>
<div id="lobby">
  <h1>🌙 Island Night</h1>
  <div style="opacity:.8;text-align:center;max-width:320px;font-size:14px">Gather wood, keep the fire alive, survive the alien nights together.</div>
  <input id="name" placeholder="Your name" maxlength="12">
  <div class="cls" id="cls">
    <div data-c="forester" class="sel"><b>🪓 Forester</b>+25% wood</div>
    <div data-c="marine"><b>🔫 Marine</b>Tough, hits hard</div>
    <div data-c="tech"><b>📻 Radio Tech</b>Fire burns slower</div>
    <div data-c="medic"><b>🩹 Medic</b>Heals, fast revive</div>
  </div>
  <input id="room" placeholder="Room code (blank = new room)" maxlength="4" style="text-transform:uppercase">
  <button id="go">PLAY</button>
  <div id="err"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script src="game.js"></script>
</body></html>
